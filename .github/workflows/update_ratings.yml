name: Update Letterboxd Ratings & README

on:
  schedule:
    # Runs every Monday at 5:15 AM Pacific Time (12:15 PM UTC)
    - cron: '15 12 * * 1'
  workflow_dispatch:

jobs:
  update-stats:
    runs-on: ubuntu-latest

    permissions:
      contents: write  # Required to commit and push changes back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas curl_cffi beautifulsoup4 tabulate

      - name: Run scraper script
        run: |
          python update_ratings.py --full

      - name: Run README generator script
        run: |
          python update_readme.py

      - name: Commit and push changes if any
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.io"
          
          git add data/ratings.csv README.md
          
          # Check if there are actual changes to commit
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: auto-update ratings and README [skip ci]" && git push)